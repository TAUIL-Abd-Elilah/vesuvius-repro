name: Cross-scan release tooling

on:
  push:
    branches:
      - physical-crossscan-release-tooling
  pull_request:
    paths:
      - CROSSSCAN_RELEASE.md
      - export_crossscan_release.py
      - predict_crossscan_probability_ensemble.py
      - test_crossscan_release.py
      - crossscan_finetune.py
      - run_crossscan_finetune.py
      - score_crossscan_finetune.py
      - test_crossscan_finetune.py
      - test_run_crossscan_finetune.py
      - test_score_crossscan_finetune.py
      - .github/workflows/crossscan-release.yml

permissions:
  contents: read

jobs:
  release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt
      - name: Compile release tooling
        run: |
          python -m py_compile \
            export_crossscan_release.py \
            predict_crossscan_probability_ensemble.py \
            test_crossscan_release.py
      - name: Run focused release and cross-scan tests
        run: |
          python -m unittest -v \
            test_crossscan_release.py \
            test_crossscan_finetune.py \
            test_run_crossscan_finetune.py \
            test_score_crossscan_finetune.py
